<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الملف الشخصي الكامل — NUSC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/colleges.css">
<style>
  .profile-hero{ max-width:1080px; margin:20px auto 0; padding:28px 26px; border-radius:22px; border:1px solid var(--line); background:var(--surface); display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
  .avatar{ width:74px; height:74px; border-radius:20px; background:linear-gradient(135deg,var(--gold),var(--tint)); display:flex; align-items:center; justify-content:center; font-size:30px; color:#fff; }
  .profile-hero h1{ font-size:19px; margin:0 0 4px; }
  .profile-hero p{ font-size:12.5px; color:var(--sub); margin:0; }

  .data-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; }
  .data-item{ padding:16px; }
  .data-item .lbl{ font-size:11.5px; color:var(--sub); font-weight:700; margin-bottom:6px; }
  .data-item .val{ font-family:'Cairo',sans-serif; font-size:14.5px; font-weight:700; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="brand">
      <div class="logo-dot">N</div>
      <div><div class="brand-name">NUSC</div><div class="brand-sub">بوابة الطالب</div></div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <span class="college-chip" data-role="college-chip"></span>
      <div class="menu-wrap">
        <button class="menu-btn" data-role="menu-btn" aria-label="خيارات إضافية">⋮</button>
        <div class="menu-dropdown" data-role="menu-dropdown">
          <div class="menu-item">✏️ تعديل البيانات</div>
          <div class="menu-item">🔒 تغيير كلمة المرور</div>
          <div class="menu-sep"></div>
          <div class="menu-item">🚪 تسجيل الخروج</div>
        </div>
      </div>
    </div>
  </div>
</header>

<div class="profile-hero">
  <div class="avatar" id="avatarIc"></div>
  <div>
    <h1 id="userName">اسم المستخدم</h1>
    <p>طالب جامعي — <span id="collegeLine"></span></p>
  </div>
</div>

<main class="container section">
  <h2>البيانات الشخصية</h2>
  <div class="data-grid">
    <div class="card data-item"><div class="lbl">البريد الإلكتروني الشخصي</div><div class="val" id="dEmailP">—</div></div>
    <div class="card data-item"><div class="lbl">البريد الإلكتروني الجامعي</div><div class="val" id="dEmailU">غير محدد</div></div>
    <div class="card data-item"><div class="lbl">كود الطالب</div><div class="val" id="dCode">—</div></div>
  </div>

  <div class="section">
    <h2>البيانات الأكاديمية</h2>
    <div class="data-grid">
      <div class="card data-item"><div class="lbl">الكلية</div><div class="val" id="dCollege">—</div></div>
      <div class="card data-item"><div class="lbl">الفرقة</div><div class="val" id="dYear">—</div></div>
      <div class="card data-item"><div class="lbl">التخصص</div><div class="val" id="dMajor">—</div></div>
    </div>
  </div>

  <div class="section">
    <button class="btn primary">✏️ تعديل البيانات</button>
    <button class="btn ghost" style="margin-inline-start:8px;">🔒 تغيير كلمة المرور</button>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" class="nav-item" data-page="home"><span class="ic">🏠</span>الرئيسية</a>
  <a href="materials.html" class="nav-item" data-page="materials"><span class="ic">📚</span>المقررات</a>
  <a href="ai-hub.html" class="nav-item" data-page="ai"><span class="ic">🤖</span>الذكاء الاصطناعي</a>
  <a href="profile.html" class="nav-item" data-page="profile"><span class="ic">🪪</span>حسابي</a>
</nav>

<script src="js/colleges-data.js"></script>
<script src="js/app.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
