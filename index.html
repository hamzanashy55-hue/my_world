<div id="app"></div>
<style>
  :root{
    --paper: #FBF3E9;
    --paper-deep: #F3E7D8;
    --plum: #3E2140;
    --plum-soft: #5A3459;
    --rose: #C97B84;
    --rose-soft: #E3B6BB;
    --gold: #C9A227;
    --ink: #2B2320;
    --ink-soft: #7A6F63;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  #app{
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    height: 100vh;
    max-height: 720px;
    min-height: 480px;
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--paper);
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(62,33,64,0.18);
    position: relative;
  }
  .serif{ font-family: Georgia, "Palatino Linotype", Palatino, serif; }

  /* ---------- Setup screen ---------- */
  .setup{
    flex: 1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 32px; text-align:center; gap: 18px;
    background: radial-gradient(circle at 30% 20%, var(--paper-deep), var(--paper) 70%);
  }
  .setup .seal{
    width:64px; height:64px; border-radius:50%;
    background: linear-gradient(145deg, var(--rose), var(--plum));
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 8px 20px rgba(62,33,64,0.25);
  }
  .setup h1{ font-size: 22px; margin: 0; letter-spacing: 0.3px; }
  .setup p{ color: var(--ink-soft); font-size: 13.5px; margin:0; max-width: 280px; line-height:1.5;}
  .setup input{
    width: 100%; max-width: 260px; padding: 12px 16px; border-radius: 999px;
    border: 1.5px solid var(--rose-soft); font-size: 15px; text-align:center;
    background: white; outline:none;
  }
  .setup input:focus{ border-color: var(--rose); }
  .setup button{
    padding: 12px 28px; border-radius: 999px; border:none; cursor:pointer;
    background: var(--plum); color: var(--paper); font-size: 14.5px; letter-spacing:0.4px;
    box-shadow: 0 6px 16px rgba(62,33,64,0.3);
  }
  .setup button:disabled{ opacity:0.4; cursor:not-allowed; }

  /* ---------- Header ---------- */
  header{
    display:flex; align-items:center; gap:12px;
    padding: 14px 16px; background: var(--plum); color: var(--paper);
    flex-shrink:0;
  }
  header .avatar{
    width:38px;height:38px;border-radius:50%;
    background: linear-gradient(145deg, var(--rose), var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-size:16px; flex-shrink:0; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25);
  }
  header .who{ flex:1; min-width:0; }
  header .who .name{ font-size:15px; font-weight:600; }
  header .who .status{ font-size:11px; color: var(--rose-soft); }
  header button.icon-btn{
    background:none;border:none;color:var(--paper);cursor:pointer;
    opacity:0.85; padding:6px; display:flex; align-items:center;
  }
  header button.icon-btn:hover{ opacity:1; }

  /* ---------- Messages ---------- */
  .messages{
    flex:1; overflow-y:auto; padding: 16px 12px 8px;
    display:flex; flex-direction:column; gap:8px;
    background-size: cover; background-position:center;
  }
  .day-divider{
    align-self:center; font-size:11px; color: var(--ink-soft);
    background: rgba(255,255,255,0.65); padding:3px 12px; border-radius:999px;
    margin: 8px 0 4px; letter-spacing:0.4px;
  }
  .bubble-row{ display:flex; }
  .bubble-row.mine{ justify-content:flex-end; }
  .bubble{
    max-width: 76%; padding: 8px 12px; border-radius: 16px; position:relative;
    font-size: 14.5px; line-height:1.42; box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }
  .bubble-row:not(.mine) .bubble{
    background: #FFFFFF; border-bottom-left-radius:4px; color: var(--ink);
    border-left: 3px solid var(--rose);
  }
  .bubble-row.mine .bubble{
    background: var(--plum); color: var(--paper); border-bottom-right-radius:4px;
    border-right: 3px solid var(--gold);
  }
  .bubble img{ max-width: 100%; border-radius: 10px; display:block; margin-top:2px; }
  .bubble audio{ height:34px; width: 210px; max-width:100%; margin-top:2px; }
  .bubble .time{ font-size:10px; opacity:0.6; margin-top:3px; text-align:right; }

  /* ---------- Input bar ---------- */
  .inputbar{
    display:flex; align-items:center; gap:8px; padding: 10px 12px;
    background: var(--paper-deep); border-top: 1px solid rgba(0,0,0,0.06); flex-shrink:0;
  }
  .inputbar button{
    background:none; border:none; cursor:pointer; color: var(--plum);
    display:flex; align-items:center; justify-content:center; padding:6px;
    flex-shrink:0;
  }
  .inputbar input[type=text]{
    flex:1; border:1.5px solid rgba(62,33,64,0.15); border-radius:999px;
    padding: 10px 16px; font-size:14.5px; outline:none; background:white;
    min-width: 0;
  }
  .inputbar input[type=text]:focus{ border-color: var(--rose); }
  .send-btn{
    background: var(--plum) !important; color: var(--paper) !important;
    border-radius:50%; width:38px; height:38px;
  }
  .mic-btn.recording{ color: #C0392B; animation: pulse 1s infinite; }
  @keyframes pulse{ 0%{opacity:1;} 50%{opacity:0.4;} 100%{opacity:1;} }

  /* ---------- Customize panel ---------- */
  .overlay{
    position:absolute; inset:0; background: rgba(43,35,32,0.45);
    display:flex; align-items:flex-end; z-index: 20;
  }
  .sheet{
    background: var(--paper); width:100%; border-radius: 20px 20px 0 0;
    padding: 20px; max-height: 70%; overflow-y:auto;
  }
  .sheet h3{ margin:0 0 14px; font-size:16px; }
  .swatches{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  .swatch{
    width:52px; height:52px; border-radius:12px; cursor:pointer; border:2px solid transparent;
  }
  .swatch.active{ border-color: var(--plum); }
  .sheet .row{ display:flex; gap:10px; margin-bottom:10px; }
  .sheet label.upload{
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:11px; border-radius:12px; border:1.5px dashed var(--rose); cursor:pointer;
    font-size:13.5px; color: var(--plum); flex:1;
  }
  .sheet .close-btn{
    width:100%; padding:11px; border-radius:12px; border:none; background: var(--plum);
    color:var(--paper); font-size:14px; cursor:pointer; margin-top:6px;
  }
  .empty-state{
    flex:1; display:flex; align-items:center; justify-content:center; flex-direction:column;
    color: var(--ink-soft); gap:8px; padding:40px; text-align:center; font-size:13.5px;
  }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background: rgba(62,33,64,0.2); border-radius:6px; }
</style>
<script>
(function(){
  const ICONS = {
    seal: `<svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M12 21s-7.5-4.6-9.6-9.3C.8 8.1 3 4.8 6.4 4.8c2 0 3.4 1.1 4.1 2.3.7-1.2 2.1-2.3 4.1-2.3 3.4 0 5.6 3.3 4 6.9C19.5 16.4 12 21 12 21z" fill="white" opacity="0.95"/></svg>`,
    gear: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1.08-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>`,
    clip: `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a5.5 5.5 0 01-7.78-7.78l9.19-9.19a3.5 3.5 0 015 5l-9.2 9.19a1.5 1.5 0 01-2.12-2.12l8.49-8.48"/></svg>`,
    mic: `<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/><path d="M19 10v2a7 7 0 01-14 0v-2M12 19v3"/></svg>`,
    send: `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg>`,
    stop: `<svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>`
  };

  const GRADIENTS = [
    {name:'ورد', css: 'linear-gradient(160deg,#F6D9DC,#F3E7D8)'},
    {name:'بنفسجي', css: 'linear-gradient(160deg,#E5D4E8,#F3E7D8)'},
    {name:'ذهبي', css: 'linear-gradient(160deg,#F3E3B8,#F3E7D8)'},
    {name:'ليلي', css: 'linear-gradient(160deg,#D8CBE0,#3E2140)'},
    {name:'ورقي', css: '#FBF3E9'},
  ];

  const root = document.getElementById('app');
  let myName = null;
  let cache = {}; // id -> message
  let lastIndexKey = '';
  let pollTimer = null;
  let mediaRecorder = null, recordedChunks = [], recording = false;
  let panelOpen = false;
  let background = { type:'gradient', value: GRADIENTS[0].css };

  function fileToDataURL(file){
    return new Promise((res, rej)=>{
      const r = new FileReader();
      r.onload = ()=>res(r.result);
      r.onerror = rej;
      r.readAsDataURL(file);
    });
  }

  function resizeImage(dataUrl, maxW){
    return new Promise((resolve)=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW / img.width);
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = ()=>resolve(dataUrl);
      img.src = dataUrl;
    });
  }

  async function storageGet(key, shared){
    try{
      const r = await window.storage.get(key, shared);
      return r ? r.value : null;
    }catch(e){ return null; }
  }
  async function storageSet(key, value, shared){
    try{ return await window.storage.set(key, value, shared); }
    catch(e){ console.error('storage set failed', e); return null; }
  }

  async function loadName(){
    const v = await storageGet('my-name', false);
    return v;
  }
  async function saveName(name){
    await storageSet('my-name', name, false);
  }

  async function loadIndex(){
    const v = await storageGet('chat:index', true);
    if(!v) return [];
    try{ return JSON.parse(v); }catch(e){ return []; }
  }
  async function saveIndex(ids){
    await storageSet('chat:index', JSON.stringify(ids), true);
  }

  async function loadBackground(){
    const v = await storageGet('chat:background', true);
    if(v){ try{ background = JSON.parse(v); }catch(e){} }
  }
  async function saveBackground(bg){
    background = bg;
    await storageSet('chat:background', JSON.stringify(bg), true);
    render();
  }

  async function sendMessage(msg){
    const id = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    msg.id = id; msg.time = Date.now(); msg.sender = myName;
    cache[id] = msg;
    render();
    await storageSet('chat:msg:' + id, JSON.stringify(msg), true);
    const ids = await loadIndex();
    ids.push(id);
    await saveIndex(ids);
  }

  async function fetchNewMessages(){
    const ids = await loadIndex();
    const key = ids.join(',');
    if(key === lastIndexKey) return false;
    lastIndexKey = key;
    const toFetch = ids.filter(id => !cache[id]);
    await Promise.all(toFetch.map(async id=>{
      const v = await storageGet('chat:msg:' + id, true);
      if(v){ try{ cache[id] = JSON.parse(v); }catch(e){} }
    }));
    render();
    return true;
  }

  function fmtTime(ts){
    const d = new Date(ts);
    let h = d.getHours(); const m = d.getMinutes().toString().padStart(2,'0');
    const ampm = h >= 12 ? 'م' : 'ص';
    h = h % 12 || 12;
    return h + ':' + m + ' ' + ampm;
  }
  function fmtDay(ts){
    const d = new Date(ts);
    return d.toLocaleDateString('ar-EG', { day:'numeric', month:'long' });
  }

  function orderedMessages(){
    const ids = Object.keys(cache);
    return ids.map(id=>cache[id]).filter(Boolean).sort((a,b)=>a.time-b.time);
  }

  async function startRecording(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e)=>{ if(e.data.size>0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = async ()=>{
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        const dataUrl = await fileToDataURL(blob);
        await sendMessage({ type:'audio', content: dataUrl });
        stream.getTracks().forEach(t=>t.stop());
      };
      mediaRecorder.start();
      recording = true;
      render();
    }catch(e){
      alert('محتاجين إذن استخدام المايك عشان تسجل صوت.');
    }
  }
  function stopRecording(){
    if(mediaRecorder && recording){
      mediaRecorder.stop();
      recording = false;
      render();
    }
  }

  function backgroundStyle(){
    if(background.type === 'image') return `background-image:url(${background.value})`;
    return `background:${background.value}`;
  }

  function render(){
    if(!myName){
      root.innerHTML = `
        <div class="setup">
          <div class="seal">${ICONS.seal}</div>
          <h1 class="serif">مساحتكم الخاصة</h1>
          <p>شات خاص بينك وبين حبيبتك بس. اكتب اسمك عشان يبان مين بيبعت مين.</p>
          <input id="nameInput" type="text" placeholder="اكتب اسمك هنا" maxlength="20" />
          <button id="startBtn">ادخل الشات</button>
        </div>`;
      const input = document.getElementById('nameInput');
      const btn = document.getElementById('startBtn');
      input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') btn.click(); });
      btn.addEventListener('click', async ()=>{
        const val = input.value.trim();
        if(!val) return;
        myName = val;
        await saveName(val);
        await init();
      });
      return;
    }

    const msgs = orderedMessages();
    let lastDay = null;
    let msgsHtml = '';
    if(msgs.length === 0){
      msgsHtml = `<div class="empty-state">${ICONS.seal}<div>لسه مفيش رسايل... ابعتوا أول رسالة!</div></div>`;
    } else {
      for(const m of msgs){
        const day = fmtDay(m.time);
        if(day !== lastDay){
          msgsHtml += `<div class="day-divider">${day}</div>`;
          lastDay = day;
        }
        const mine = m.sender === myName;
        let inner = '';
        if(m.type === 'text'){
          inner = `<div>${escapeHtml(m.content)}</div>`;
        } else if(m.type === 'image'){
          inner = `<img src="${m.content}" />`;
        } else if(m.type === 'audio'){
          inner = `<audio controls src="${m.content}"></audio>`;
        }
        msgsHtml += `
          <div class="bubble-row ${mine?'mine':''}">
            <div class="bubble">
              ${inner}
              <div class="time">${fmtTime(m.time)}</div>
            </div>
          </div>`;
      }
    }

    root.innerHTML = `
      <header>
        <div class="avatar">${ICONS.seal}</div>
        <div class="who">
          <div class="name serif">مساحتنا</div>
          <div class="status">بينك وبين حبيبتك بس</div>
        </div>
        <button class="icon-btn" id="gearBtn">${ICONS.gear}</button>
      </header>
      <div class="messages" id="msgList" style="${backgroundStyle()}">
        ${msgsHtml}
      </div>
      <div class="inputbar">
        <button id="clipBtn">${ICONS.clip}</button>
        <input type="file" id="fileInput" accept="image/*" style="display:none" />
        <input type="text" id="textInput" placeholder="اكتب رسالة..." />
        <button class="mic-btn ${recording?'recording':''}" id="micBtn">${recording ? ICONS.stop : ICONS.mic}</button>
        <button class="send-btn" id="sendBtn">${ICONS.send}</button>
      </div>
      ${panelOpen ? renderPanel() : ''}
    `;

    const msgList = document.getElementById('msgList');
    msgList.scrollTop = msgList.scrollHeight;

    document.getElementById('sendBtn').addEventListener('click', onSend);
    document.getElementById('textInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') onSend(); });
    document.getElementById('clipBtn').addEventListener('click', ()=> document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', onImagePicked);
    document.getElementById('micBtn').addEventListener('click', ()=> recording ? stopRecording() : startRecording());
    document.getElementById('gearBtn').addEventListener('click', ()=>{ panelOpen = true; render(); });

    if(panelOpen) bindPanelEvents();
  }

  function renderPanel(){
    const swatches = GRADIENTS.map((g,i)=>`
      <div class="swatch ${background.type==='gradient' && background.value===g.css ? 'active':''}"
           data-css="${g.css}" style="background:${g.css}" title="${g.name}"></div>
    `).join('');
    return `
      <div class="overlay" id="overlay">
        <div class="sheet">
          <h3 class="serif">غيّروا خلفية الشات</h3>
          <div class="swatches" id="swatches">${swatches}</div>
          <div class="row">
            <label class="upload">
              ${ICONS.clip} صورة من عندكم
              <input type="file" id="bgFile" accept="image/*" style="display:none" />
            </label>
          </div>
          <button class="close-btn" id="closePanel">تمام كده</button>
        </div>
      </div>`;
  }

  function bindPanelEvents(){
    document.getElementById('overlay').addEventListener('click', (e)=>{
      if(e.target.id === 'overlay'){ panelOpen = false; render(); }
    });
    document.getElementById('closePanel').addEventListener('click', ()=>{ panelOpen = false; render(); });
    document.querySelectorAll('.swatch').forEach(sw=>{
      sw.addEventListener('click', ()=>{
        saveBackground({ type:'gradient', value: sw.dataset.css });
        panelOpen = false;
      });
    });
    document.getElementById('bgFile').addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const raw = await fileToDataURL(file);
      const resized = await resizeImage(raw, 900);
      await saveBackground({ type:'image', value: resized });
      panelOpen = false;
    });
  }

  async function onSend(){
    const input = document.getElementById('textInput');
    const val = input.value.trim();
    if(!val) return;
    input.value = '';
    await sendMessage({ type:'text', content: val });
  }

  async function onImagePicked(e){
    const file = e.target.files[0];
    if(!file) return;
    e.target.value = '';
    const raw = await fileToDataURL(file);
    const resized = await resizeImage(raw, 900);
    await sendMessage({ type:'image', content: resized });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  async function init(){
    await loadBackground();
    await fetchNewMessages();
    render();
    if(pollTimer) clearInterval(pollTimer);
    pollTimer = setInterval(fetchNewMessages, 2500);
  }

  (async function boot(){
    myName = await loadName();
    if(myName){ await init(); }
    else render();
  })();
})();
</script>
